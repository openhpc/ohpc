name: Build and Publish OHPC Validate Containers

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # The IBM ppc64le runners only run jobs for openhpc/ohpc. In a fork, the
    # ppc64le job waits for a runner until GitHub cancels it after 24 hours.
    # A fork cannot push to ghcr.io/openhpc either, so the whole job is
    # skipped there.
    if: github.repository == 'openhpc/ohpc'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      # A failed ppc64le build must not cancel the x86_64 and aarch64 builds.
      fail-fast: false
      matrix:
        distro: [ almalinux, openeuler ]
        arch: [ x86_64, aarch64 ]
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
          # The ppc64le packages come from a copr project that only contains
          # EL packages, so openEuler is not built on ppc64le.
          - distro: almalinux
            arch: ppc64le
            runs-on: ubuntu-24.04-ppc64le-p10
    outputs:
      almalinux-digest-x86_64: ${{ steps.export.outputs.almalinux-digest-x86_64 }}
      almalinux-digest-aarch64: ${{ steps.export.outputs.almalinux-digest-aarch64 }}
      almalinux-digest-ppc64le: ${{ steps.export.outputs.almalinux-digest-ppc64le }}
      openeuler-digest-x86_64: ${{ steps.export.outputs.openeuler-digest-x86_64 }}
      openeuler-digest-aarch64: ${{ steps.export.outputs.openeuler-digest-aarch64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}
          tags: |
            type=raw,value=latest

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tests/ci/Containerfile.ohpc-validate-${{ matrix.distro }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        id: export
        run: |
          echo "${{ matrix.distro }}-digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-24.04
    needs: build
    # The ppc64le runners are an external service. A failed ppc64le build
    # must not stop the update of the x86_64 and aarch64 images.
    if: ${{ !cancelled() && github.repository == 'openhpc/ohpc' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        distro: [ almalinux, openeuler ]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}
          DIGEST_X86_64: ${{ needs.build.outputs[format('{0}-digest-x86_64', matrix.distro)] }}
          DIGEST_AARCH64: ${{ needs.build.outputs[format('{0}-digest-aarch64', matrix.distro)] }}
          DIGEST_PPC64LE: ${{ needs.build.outputs[format('{0}-digest-ppc64le', matrix.distro)] }}
        run: |
          if [ -z "${DIGEST_X86_64}" ] || [ -z "${DIGEST_AARCH64}" ]; then
            echo "::error::The x86_64 or aarch64 build failed, ${IMAGE}:latest is not updated"
            exit 1
          fi
          sources=("${IMAGE}@${DIGEST_X86_64}" "${IMAGE}@${DIGEST_AARCH64}")
          if [ -n "${DIGEST_PPC64LE}" ]; then
            sources+=("${IMAGE}@${DIGEST_PPC64LE}")
          elif [ "${DISTRO}" = "almalinux" ]; then
            echo "::warning::The ppc64le build failed, ${IMAGE}:latest contains no ppc64le image"
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${sources[@]}"

      - name: Output image details
        run: |
          echo "Container built and pushed successfully!"
          echo "Image: ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}:latest"

  build-3x:
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        distro: [ almalinux, openeuler, leap ]
        arch: [ x86_64, aarch64 ]
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    outputs:
      almalinux-digest-x86_64: ${{ steps.export.outputs.almalinux-digest-x86_64 }}
      almalinux-digest-aarch64: ${{ steps.export.outputs.almalinux-digest-aarch64 }}
      openeuler-digest-x86_64: ${{ steps.export.outputs.openeuler-digest-x86_64 }}
      openeuler-digest-aarch64: ${{ steps.export.outputs.openeuler-digest-aarch64 }}
      leap-digest-x86_64: ${{ steps.export.outputs.leap-digest-x86_64 }}
      leap-digest-aarch64: ${{ steps.export.outputs.leap-digest-aarch64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: 3.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}
          tags: |
            type=raw,value=3.x

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tests/ci/Containerfile.ohpc-validate-${{ matrix.distro }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        id: export
        run: |
          echo "${{ matrix.distro }}-digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  publish-3x:
    runs-on: ubuntu-24.04
    needs: build-3x
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        distro: [ almalinux, openeuler, leap ]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}:3.x \
            ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}@${{ needs.build-3x.outputs[format('{0}-digest-x86_64', matrix.distro)] }} \
            ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}@${{ needs.build-3x.outputs[format('{0}-digest-aarch64', matrix.distro)] }}

      - name: Output image details
        run: |
          echo "Container built and pushed successfully!"
          echo "Image: ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}:3.x"

  build-2x:
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        distro: [ almalinux, leap ]
        arch: [ x86_64, aarch64 ]
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    outputs:
      almalinux-digest-x86_64: ${{ steps.export.outputs.almalinux-digest-x86_64 }}
      almalinux-digest-aarch64: ${{ steps.export.outputs.almalinux-digest-aarch64 }}
      leap-digest-x86_64: ${{ steps.export.outputs.leap-digest-x86_64 }}
      leap-digest-aarch64: ${{ steps.export.outputs.leap-digest-aarch64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: 2.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}
          tags: |
            type=raw,value=2.x

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tests/ci/Containerfile.ohpc-validate-${{ matrix.distro }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        id: export
        run: |
          echo "${{ matrix.distro }}-digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  publish-2x:
    runs-on: ubuntu-24.04
    needs: build-2x
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        distro: [ almalinux, leap ]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}:2.x \
            ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}@${{ needs.build-2x.outputs[format('{0}-digest-x86_64', matrix.distro)] }} \
            ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}@${{ needs.build-2x.outputs[format('{0}-digest-aarch64', matrix.distro)] }}

      - name: Output image details
        run: |
          echo "Container built and pushed successfully!"
          echo "Image: ${{ env.REGISTRY }}/openhpc/ohpc-validate-${{ matrix.distro }}:2.x"
