name: Package Update Checker

on:
  schedule:
    # Run every Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: >
          Branch to check for package updates. Leave empty to check
          all configured branches.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

jobs:
  # Determine which branches to check
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
    - name: Set branch matrix
      id: set-branches
      run: |
        # Add branches to check here as the project evolves
        ALL_BRANCHES='["3.x", "4.x"]'
        INPUT_BRANCH="${{ inputs.branch }}"

        if [ -n "$INPUT_BRANCH" ]; then
          echo "branches=[\"${INPUT_BRANCH}\"]" >> $GITHUB_OUTPUT
        else
          echo "branches=${ALL_BRANCHES}" >> $GITHUB_OUTPUT
        fi

  check-updates:
    needs: setup-matrix
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/openhpc/ohpc-analysis:latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.setup-matrix.outputs.branches) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}

    - name: Run package update checker
      id: check_updates
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Ensure we're in the repository root
        cd $GITHUB_WORKSPACE

        # Set up RPM build environment for container
        echo "Setting up RPM environment in container"
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

        # Run the script and capture output and exit code
        # Redirect stderr to a file for debugging (avoid terminal control chars in issues)
        set +e
        OUTPUT=$(python3 misc/check_for_package_updates.py -o markdown --no-glow 2>package_updates_stderr.log)
        EXIT_CODE=$?
        set -e

        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

        # Save output to file for later use
        echo "$OUTPUT" > package_updates.md

        echo "Script completed with exit code: $EXIT_CODE"
        echo "Output length: $(echo "$OUTPUT" | wc -l) lines"

        # Show stderr if the script failed, for debugging
        if [ $EXIT_CODE -ne 0 ] && [ -s package_updates_stderr.log ]; then
          echo "--- stderr output ---"
          cat package_updates_stderr.log
          echo "--- end stderr ---"
        fi

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Manage GitHub issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const exitCode = ${{ steps.check_updates.outputs.exit_code }};
          const currentDate = '${{ steps.date.outputs.date }}';
          const branch = '${{ matrix.branch }}';
          const issueTitle = `📦 Package Upgrades Necessary [${branch}] - ${currentDate}`;
          const titlePrefix = `📦 Package Upgrades Necessary [${branch}]`;

          console.log(`Processing package updates for branch ${branch} with exit code: ${exitCode}`);

          // Read the markdown output
          let markdownOutput;
          try {
            markdownOutput = fs.readFileSync('package_updates.md', 'utf8');
            console.log(`Read markdown output: ${markdownOutput.length} characters`);
          } catch (error) {
            console.error('Error reading package update results:', error);
            markdownOutput = `Error reading package update results: ${error.message}`;
          }

          // Handle unexpected exit codes
          if (exitCode !== 0 && exitCode !== 1) {
            console.log(`Unexpected exit code ${exitCode}, treating as error condition`);
            markdownOutput = `⚠️ Package update checker encountered an error (exit code: ${exitCode})\n\n${markdownOutput}`;
          }

          // If the script exited non-zero but produced no output, it likely
          // crashed rather than finding updates. Do not create an empty issue.
          if (exitCode !== 0 && markdownOutput.trim().length === 0) {
            core.setFailed(`Script exited with code ${exitCode} but produced no output (likely a crash). Not creating an issue.`);
            return;
          }

          // Search for existing open issues with package upgrade title pattern
          // for this specific branch
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['package-updates']
          });

          // Find the most recent package upgrade issue for this branch
          const existingIssue = issues
            .filter(issue => issue.title.includes(titlePrefix))
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

          // Prepare issue body
          const issueBody = [
            `# Package Update Status [${branch}] - ${currentDate}`,
            '',
            `This issue tracks available package updates for the \`${branch}\` branch.`,
            '',
            `**Branch:** \`${branch}\``,
            `**Last checked:** ${new Date().toISOString()}`,
            `**Status:** ${exitCode === 0 ? '✅ All packages up to date' : '🔄 Updates available'}`,
            '',
            '---',
            '',
            markdownOutput,
            '',
            '---',
            '',
            '*This issue is automatically managed by the Package Update Checker workflow.*'
          ].join('\n');

          if (exitCode === 0) {
            // No updates available
            if (existingIssue) {
              console.log(`Closing issue #${existingIssue.number} - no updates available for ${branch}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                state: 'closed',
                body: issueBody
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `✅ All packages on \`${branch}\` are now up to date. Closing this issue.`
              });
            } else {
              console.log(`No updates available for ${branch} and no open issue exists - nothing to do`);
            }
          } else {
            // Updates are available (exit code 1)
            if (existingIssue) {
              console.log(`Updating existing issue #${existingIssue.number} with latest package updates for ${branch}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                title: issueTitle,
                body: issueBody
              });
            } else {
              console.log(`Creating new issue for package updates on ${branch}`);
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['package-updates', 'automation']
              });

              console.log(`Created new issue #${newIssue.number}`);
            }
          }
