name: Validate

on:
  push:
    branches:
      - 4.x
  pull_request:
    branches:
      - 4.x
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Open an interactive SSH (tmate) session if a job fails'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  # A new push to a pull request cancels the run for the previous push.
  # Pushes to 4.x and manual runs get a unique group and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  SKIP_CI_SPECS: |
    components/fs/lustre-client/SPECS/lustre.spec
    components/parallel-libs/trilinos/SPECS/trilinos.spec
    components/parallel-libs/opencoarrays/SPECS/opencoarrays.spec
    components/dev-tools/scipy/SPECS/python-scipy.spec

jobs:
  check_spec:
    env:
      JOB_SKIP_CI_SPECS: |
        components/admin/ohpc-filesystem/SPECS/ohpc-filesystem.spec

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/openhpc/ohpc-analysis:latest

    steps:
    - uses: actions/checkout@v7
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - name: Validate Changes
      run: |
        export SKIP_CI_SPECS="${{ env.SKIP_CI_SPECS }}${{ env.JOB_SKIP_CI_SPECS }}"
        tests/ci/check_spec.py ${{ steps.files.outputs.added_modified }}


  build_on_rhel:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        compiler: [gnu16, intel]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
        exclude:
          - os: ubuntu-24.04-arm
            compiler: intel
    runs-on: ${{ matrix.os }}
    name: Build on RHEL (${{ matrix.arch }}/${{ matrix.compiler }})
    container: &rhel-build-container
      image: ghcr.io/openhpc/ohpc-validate-almalinux:latest
      volumes:
        - /usr:/host/usr
        - /opt:/host/opt
    steps: &rhel-build-steps
    - name: Delete unneeded tools on the host
      # Needed to have enough space to install the Intel compiler
      run: |
        rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc
    - name: Update packages
      run: dnf -y update
    - uses: actions/checkout@v7
    - name: Restore ccache
      uses: actions/cache/restore@v6
      with:
        path: /var/cache/ccache
        key: ccache-rhel-${{ matrix.arch }}-${{ matrix.compiler }}-${{ github.sha }}
        restore-keys: |
          ccache-rhel-${{ matrix.arch }}-${{ matrix.compiler }}-
    - name: Restore oneAPI package cache
      if: matrix.compiler == 'intel'
      uses: ./.github/actions/oneapi-cache
      with:
        mode: restore
    - name: Setup
      run: tests/ci/prepare-ci-environment.sh  ${{ matrix.compiler }}
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - name: Validate Build
      run: |
        export SKIP_CI_SPECS="${{ env.SKIP_CI_SPECS }}"
        # openEuler-only: the OpenHPC Go toolchain exists because openEuler's
        # distro Go is too old; EL ships a new-enough go-toolset, so skip it here.
        export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/dev-tools/golang/SPECS/golang.spec"
        if [ "${{ matrix.compiler }}" == "intel" ]; then
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/serial-libs/openblas/SPECS/openblas.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/dev-tools/scipy/SPECS/python-scipy.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/serial-libs/R/SPECS/R.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/parallel-libs/opencoarrays/SPECS/opencoarrays.spec"
        fi
        if [ "${{ matrix.os }}" == "ubuntu-24.04-arm" ]; then
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/compiler-families/intel-compilers-devel/SPECS/intel-compilers-devel.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/mpi-families/impi-devel/SPECS/intel-mpi.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/perf-tools/likwid/SPECS/likwid.spec"
        fi
        # The Intel packages only build on x86_64. cuda-devel only builds on
        # x86_64 and aarch64.
        if [ "${{ matrix.arch }}" == "ppc64le" ]; then
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/compiler-families/intel-compilers-devel/SPECS/intel-compilers-devel.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/mpi-families/impi-devel/SPECS/intel-mpi.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/dev-tools/cuda-devel/SPECS/cuda-devel.spec"
        fi
        if [ -e /etc/profile.d/modules.sh ]; then . /etc/profile.d/modules.sh; else . /etc/profile.d/lmod.sh; fi
        tests/ci/run_build.py ohpc ${{ steps.files.outputs.added_modified }} --compiler-family ${{ matrix.compiler }}
        touch /tmp/empty
    - uses: actions/upload-artifact@v7
      with:
        name: rhel-rpms-${{ matrix.compiler }}-${{ matrix.os }}
        retention-days: 1
        path: |
          /home/ohpc/rpmbuild/RPMS/aarch64/*rpm
          /home/ohpc/rpmbuild/RPMS/noarch/*rpm
          /home/ohpc/rpmbuild/RPMS/ppc64le/*rpm
          /home/ohpc/rpmbuild/RPMS/x86_64/*rpm
          /tmp/empty
    - name: Save oneAPI package cache
      if: always() && matrix.compiler == 'intel'
      uses: ./.github/actions/oneapi-cache
      with:
        mode: save
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: /var/cache/ccache
        key: ccache-rhel-${{ matrix.arch }}-${{ matrix.compiler }}-${{ github.sha }}-${{ github.run_id }}-build

  test_on_rhel:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        compiler: [gnu16, intel]
        rms: [slurm, flux]
        modules: [lmod-ohpc]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          # Run the tests under Environment Modules in one configuration
          - os: ubuntu-latest
            arch: x86_64
            compiler: gnu16
            rms: slurm
            modules: environment-modules-ohpc
            name_suffix: /environment-modules
            artifact_suffix: -environment-modules
        exclude:
          - os: ubuntu-24.04-arm
            compiler: intel
    runs-on: ${{ matrix.os }}
    name: Test on RHEL (${{ matrix.arch }}/${{ matrix.compiler }}/${{ matrix.rms }}${{ matrix.name_suffix }})
    env: &rhel-test-env
      MODULES_PACKAGE: ${{ matrix.modules }}
      JOB_SKIP_CI_SPECS: |
        components/perf-tools/likwid/SPECS/likwid.spec
    container: &rhel-test-container
      image: ghcr.io/openhpc/ohpc-validate-almalinux:latest
      options: --privileged --security-opt seccomp=unconfined --security-opt apparmor=unconfined
      volumes:
        - /usr:/host/usr
        - /opt:/host/opt
    needs: build_on_rhel
    steps: &rhel-test-steps
    - name: Delete unneeded tools on the host
      # Needed to have enough space to install the Intel compiler
      run: |
        rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc
    - name: Update packages
      run: dnf -y update
    - uses: actions/checkout@v7
    - name: Restore ccache
      uses: actions/cache/restore@v6
      with:
        path: /var/cache/ccache
        key: ccache-rhel-${{ matrix.arch }}-${{ matrix.compiler }}-${{ github.sha }}-${{ github.run_id }}-build
        restore-keys: |
          ccache-rhel-${{ matrix.arch }}-${{ matrix.compiler }}-
    - name: Restore oneAPI package cache
      if: matrix.compiler == 'intel'
      uses: ./.github/actions/oneapi-cache
      with:
        mode: restore
    - name: Setup
      run: tests/ci/prepare-ci-environment.sh  ${{ matrix.compiler }}
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - uses: actions/download-artifact@v8
      with:
        name: rhel-rpms-${{ matrix.compiler }}-${{ matrix.os }}
        path: /home/ohpc/rpmbuild/RPMS
    - name: Check for ALL tests marker
      id: check_all
      uses: ./.github/actions/check-tests-all
    - name: Enable unprivileged user namespaces
      run: |
        sysctl -w kernel.unprivileged_userns_clone=1 || true
        sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Run CI Tests
      run: |
        export SKIP_CI_SPECS="${{ env.SKIP_CI_SPECS }}${{ env.JOB_SKIP_CI_SPECS }}"
        if [ "${{ matrix.compiler }}" == "intel" ]; then
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/serial-libs/openblas/SPECS/openblas.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/dev-tools/scipy/SPECS/python-scipy.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/dev-tools/spack/SPECS/spack.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/dev-tools/cmake/SPECS/cmake.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/serial-libs/R/SPECS/R.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/parallel-libs/opencoarrays/SPECS/opencoarrays.spec"
        fi
        if [ "${{ matrix.os }}" == "ubuntu-24.04-arm" ]; then
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/compiler-families/intel-compilers-devel/SPECS/intel-compilers-devel.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/mpi-families/impi-devel/SPECS/intel-mpi.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/perf-tools/likwid/SPECS/likwid.spec"
        fi
        # The Intel packages only build on x86_64. cuda-devel only builds on
        # x86_64 and aarch64.
        if [ "${{ matrix.arch }}" == "ppc64le" ]; then
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/compiler-families/intel-compilers-devel/SPECS/intel-compilers-devel.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/mpi-families/impi-devel/SPECS/intel-mpi.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/dev-tools/cuda-devel/SPECS/cuda-devel.spec"
        fi
        if [ -e /etc/profile.d/modules.sh ]; then . /etc/profile.d/modules.sh; else . /etc/profile.d/lmod.sh; fi
        chown ohpc -R tests
        if [ "${{ matrix.rms }}" == "flux" ]; then
          RUN_TESTS_SCRIPT=tests/ci/setup_flux_and_run_tests.sh
        else
          RUN_TESTS_SCRIPT=tests/ci/setup_slurm_and_run_tests.sh
        fi
        if [ "${{ steps.check_all.outputs.run_all }}" == "true" ] && [ "${{ matrix.compiler }}" != "intel" ]; then
          "${RUN_TESTS_SCRIPT}" ohpc ${{ matrix.compiler }} ALL
        else
          "${RUN_TESTS_SCRIPT}" ohpc ${{ matrix.compiler }} ${{ steps.files.outputs.added_modified }}
        fi
    - name: Upload Test Results
      # To display test results from forked repositories they need to
      # be uploaded and then analyzed.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.rms }}-${{ matrix.compiler }}-${{ matrix.os }}${{ matrix.artifact_suffix }}
        retention-days: 1
        path: tests/**/*.log.xml
    - name: Save oneAPI package cache
      if: always() && matrix.compiler == 'intel'
      uses: ./.github/actions/oneapi-cache
      with:
        mode: save
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: /var/cache/ccache
        key: ccache-rhel-${{ matrix.arch }}-${{ matrix.compiler }}-${{ github.sha }}-${{ github.run_id }}-${{ matrix.rms }}${{ matrix.artifact_suffix }}
    - name: Upload ccache stats
      if: always()
      uses: ./.github/actions/upload-ccache-stats
      with:
        job-name: "RHEL (${{ matrix.arch }}/${{ matrix.compiler }}/${{ matrix.rms }}${{ matrix.name_suffix }})"
        artifact-suffix: rhel-${{ matrix.arch }}-${{ matrix.compiler }}-${{ matrix.rms }}${{ matrix.artifact_suffix }}

  # The IBM ppc64le runners only run jobs for openhpc/ohpc, which includes
  # pull requests from forks. In a workflow run inside a fork, a ppc64le job
  # waits for a runner until GitHub cancels it after 24 hours. A job-level
  # condition cannot read the matrix, so ppc64le runs in separate jobs. These
  # jobs reuse the container and steps of build_on_rhel and test_on_rhel.
  build_on_rhel_ppc64le:
    if: github.repository == 'openhpc/ohpc'
    strategy:
      matrix:
        os: [ubuntu-24.04-ppc64le-p10]
        arch: [ppc64le]
        compiler: [gnu16]
    runs-on: ${{ matrix.os }}
    name: Build on RHEL (${{ matrix.arch }}/${{ matrix.compiler }})
    container: *rhel-build-container
    steps: *rhel-build-steps

  test_on_rhel_ppc64le:
    if: github.repository == 'openhpc/ohpc'
    strategy:
      matrix:
        os: [ubuntu-24.04-ppc64le-p10]
        arch: [ppc64le]
        compiler: [gnu16]
        # The ppc64le copr contains no Flux packages.
        rms: [slurm]
        modules: [lmod-ohpc]
    runs-on: ${{ matrix.os }}
    name: Test on RHEL (${{ matrix.arch }}/${{ matrix.compiler }}/${{ matrix.rms }})
    env: *rhel-test-env
    container: *rhel-test-container
    needs: build_on_rhel_ppc64le
    steps: *rhel-test-steps

  integration_test:
    strategy:
      fail-fast: false
      matrix:
        provisioner: [warewulf, openchami]
    runs-on: ubuntu-latest
    name: AlmaLinux 10 ${{ matrix.provisioner }} Slurm Integration
    needs: build_on_rhel
    # The job provisions VMs and can wait on them, so without a limit it
    # inherits the six hour default and a hung boot has to be cancelled by
    # hand. The run itself takes 10 to 16 minutes.
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: rhel-rpms-gnu16-ubuntu-latest
        path: rpms
    - name: Check for integration tests marker
      id: check_integration
      uses: ./.github/actions/check-integration-tests
    - name: Disable AppArmor
      run: |
        sudo aa-teardown || true
        sudo systemctl disable apparmor
    - name: Enable unprivileged user namespaces
      run: |
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Start AlmaLinux 10 container
      run: >-
        sudo mkdir -p /mnt/nested-container;
        sudo podman run
        -w /home/ohpc
        --privileged
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        -v /home:/home
        -v /opt:/opt
        -v /mnt/nested-container:/var/lib/containers
        -v ${{ github.workspace }}:/home/ohpc
        -v ${{ github.workspace }}/rpms:/tmp/RPMS
        -d
        --systemd=true
        --hostname sms
        quay.io/almalinuxorg/10-init
        /usr/lib/systemd/systemd
    - name: Run integration test
      run: >-
        sudo podman exec -it -l
        -e INTEGRATION_TESTS="${{ steps.check_integration.outputs.tests }}"
        bash -c "cd /home/ohpc; bash tests/ci/integration-test.sh -p ${{ matrix.provisioner }}"
    # Opens an interactive session and holds the runner until someone
    # connects and exits, so it must not fire on an ordinary failure: a
    # two minute package mirror hiccup otherwise occupies a runner for
    # hours. Re-run the workflow by hand (Actions, Run workflow) with
    # "Open an interactive SSH session" ticked when you want to debug.
    - name: Debug via SSH
      if: failure() && inputs.debug_enabled
      timeout-minutes: 30
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true

  build_on_openEuler:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    env:
      JOB_SKIP_CI_SPECS: |
        components/admin/docs/SPECS/docs.spec
        components/provisioning/warewulf/SPECS/warewulf.spec
        components/rms/flux-core/SPECS/flux-core.spec
        components/rms/flux-pmix/SPECS/flux-pmix.spec
        components/rms/flux-sched/SPECS/flux-sched.spec
        components/rms/flux-security/SPECS/flux-security.spec
    runs-on: ${{ matrix.os }}
    name: Build on openEuler (${{ matrix.arch }})
    container:
      image: ghcr.io/openhpc/ohpc-validate-openeuler:latest
    steps:
    - name: Update packages
      run: dnf -y update
    - uses: actions/checkout@v7
    - name: Restore ccache
      uses: actions/cache/restore@v6
      with:
        path: /var/cache/ccache
        key: ccache-openeuler-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-openeuler-${{ matrix.arch }}-
    - name: Setup
      run: tests/ci/prepare-ci-environment.sh  ${{ matrix.compiler }}
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - name: Validate Build
      run: |
        export SKIP_CI_SPECS="${{ env.SKIP_CI_SPECS }}${{ env.JOB_SKIP_CI_SPECS }}"
        if [ "${{ matrix.os }}" == "ubuntu-24.04-arm" ]; then
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/compiler-families/intel-compilers-devel/SPECS/intel-compilers-devel.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/mpi-families/impi-devel/SPECS/intel-mpi.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/perf-tools/likwid/SPECS/likwid.spec"
        fi
        if [ -e /etc/profile.d/modules.sh ]; then . /etc/profile.d/modules.sh; else . /etc/profile.d/lmod.sh; fi
        tests/ci/run_build.py ohpc ${{ steps.files.outputs.added_modified }}
        touch /tmp/empty
    - uses: actions/upload-artifact@v7
      with:
        name: openEuler-rpms-${{ matrix.os }}
        retention-days: 1
        path: |
          /home/ohpc/rpmbuild/RPMS/aarch64/*rpm
          /home/ohpc/rpmbuild/RPMS/noarch/*rpm
          /home/ohpc/rpmbuild/RPMS/x86_64/*rpm
          /tmp/empty
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: /var/cache/ccache
        key: ccache-openeuler-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-build

  test_on_openEuler:
    strategy:
      matrix:
        compiler: [gnu16]
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    env:
      JOB_SKIP_CI_SPECS: |
        components/admin/docs/SPECS/docs.spec
        components/runtimes/charliecloud/SPECS/charliecloud.spec
        components/perf-tools/likwid/SPECS/likwid.spec
        components/provisioning/warewulf/SPECS/warewulf.spec
        components/rms/flux-core/SPECS/flux-core.spec
        components/rms/flux-pmix/SPECS/flux-pmix.spec
        components/rms/flux-sched/SPECS/flux-sched.spec
        components/rms/flux-security/SPECS/flux-security.spec
    runs-on: ${{ matrix.os }}
    name: Test on openEuler (${{ matrix.arch }}/${{ matrix.compiler }})
    container:
      image: ghcr.io/openhpc/ohpc-validate-openeuler:latest
      options: --privileged --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    needs: build_on_openEuler
    steps:
    - name: Update packages
      run: dnf -y update
    - uses: actions/checkout@v7
    - name: Restore ccache
      uses: actions/cache/restore@v6
      with:
        path: /var/cache/ccache
        key: ccache-openeuler-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-build
        restore-keys: |
          ccache-openeuler-${{ matrix.arch }}-
    - name: Setup
      run: tests/ci/prepare-ci-environment.sh  ${{ matrix.compiler }}
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - uses: actions/download-artifact@v8
      with:
        name: openEuler-rpms-${{ matrix.os }}
        path: /home/ohpc/rpmbuild/RPMS
    - name: Check for ALL tests marker
      id: check_all
      uses: ./.github/actions/check-tests-all
    - name: Enable unprivileged user namespaces
      run: |
        sysctl -w kernel.unprivileged_userns_clone=1 || true
        sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Run CI Tests
      run: |
        export SKIP_CI_SPECS="${{ env.SKIP_CI_SPECS }}${{ env.JOB_SKIP_CI_SPECS }}"
        if [ "${{ matrix.os }}" == "ubuntu-24.04-arm" ]; then
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/compiler-families/intel-compilers-devel/SPECS/intel-compilers-devel.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/mpi-families/impi-devel/SPECS/intel-mpi.spec"
          export SKIP_CI_SPECS="${SKIP_CI_SPECS} components/perf-tools/likwid/SPECS/likwid.spec"
        fi
        if [ -e /etc/profile.d/modules.sh ]; then . /etc/profile.d/modules.sh; else . /etc/profile.d/lmod.sh; fi
        chown ohpc -R tests
        if [ "${{ steps.check_all.outputs.run_all }}" == "true" ]; then
          tests/ci/setup_slurm_and_run_tests.sh ohpc ${{ matrix.compiler }} ALL
        else
          tests/ci/setup_slurm_and_run_tests.sh ohpc ${{ matrix.compiler }} ${{ steps.files.outputs.added_modified }}
        fi
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: /var/cache/ccache
        key: ccache-openeuler-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}
    - name: Upload ccache stats
      if: always()
      uses: ./.github/actions/upload-ccache-stats
      with:
        job-name: "openEuler (${{ matrix.arch }})"
        artifact-suffix: openeuler-${{ matrix.arch }}

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
    - name: Upload
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: event-file
        retention-days: 1
        path: ${{ github.event_path }}
