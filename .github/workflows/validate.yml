name: Validate

on:
  push:
    branches:
      - 2.x
  pull_request:
    branches:
      - 2.x

env:
  SKIP_CI_SPECS: |
    components/fs/lustre-client/SPECS/lustre.spec
    components/parallel-libs/trilinos/SPECS/trilinos.spec

jobs:
  check_spec:
    env:
      JOB_SKIP_CI_SPECS: |
        components/admin/ohpc-filesystem/SPECS/ohpc-filesystem.spec

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/openhpc/ohpc-analysis:latest

    steps:
    - uses: actions/checkout@v6
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - name: Validate Changes
      run: |
        export SKIP_CI_SPECS="${{ env.SKIP_CI_SPECS }}${{ env.JOB_SKIP_CI_SPECS }}"
        tests/ci/check_spec.py ${{ steps.files.outputs.added_modified }}

  lint_markdown:
    name: Run markdown linter
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Lint markdown
      uses: DavidAnson/markdownlint-cli2-action@v23
      with:
        globs: |
          README.md
          CONTRIBUTING.md

  lint:
    strategy:
      matrix:
        step: [codespell, flake8, shellcheck, whitespace]
    name: Run ${{ matrix.step }} linter
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
    - name: Setup
      run: dnf -y install codespell make python3-flake8 ShellCheck
    - uses: actions/checkout@v6
    - name: Run ${{ matrix.step }}
      run: make -C tests/ci/ ${{ matrix.step }}-lint

  build_on_rhel:
    runs-on: ubuntu-latest
    name: Build on RHEL
    container:
      image: ghcr.io/openhpc/ohpc-validate-almalinux:2.x
    steps:
    - name: Update packages
      run: dnf -y update
    - uses: actions/checkout@v6
    - name: Setup
      run: tests/ci/prepare-ci-environment.sh
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - name: Validate Build
      run: |
        . /etc/profile.d/lmod.sh
        tests/ci/run_build.py ohpc ${{ steps.files.outputs.added_modified }}
        touch /tmp/empty
    - uses: actions/upload-artifact@v7
      with:
        name: rhel-rpms
        retention-days: 1
        path: |
          /home/ohpc/rpmbuild/RPMS/noarch/*rpm
          /home/ohpc/rpmbuild/RPMS/x86_64/*rpm
          /tmp/empty

  test_on_rhel:
    strategy:
      matrix:
        compiler: [gnu12]
    runs-on: ubuntu-latest
    name: Test on RHEL
    env:
      JOB_SKIP_CI_SPECS: |
        components/perf-tools/likwid/SPECS/likwid.spec
    container:
      image: ghcr.io/openhpc/ohpc-validate-almalinux:2.x
      options: --privileged --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    needs: build_on_rhel
    steps:
    - name: Update packages
      run: dnf -y update
    - uses: actions/checkout@v6
    - name: Setup
      run: tests/ci/prepare-ci-environment.sh
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - uses: actions/download-artifact@v8
      with:
        name: rhel-rpms
        path: /home/ohpc/rpmbuild/RPMS
    - name: Enable unprivileged user namespaces
      run: |
        sysctl -w kernel.unprivileged_userns_clone=1 || true
        sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Run CI Tests
      run: |
        export SKIP_CI_SPECS="${{ env.SKIP_CI_SPECS }}${{ env.JOB_SKIP_CI_SPECS }}"
        . /etc/profile.d/lmod.sh
        chown ohpc -R tests
        tests/ci/setup_slurm_and_run_tests.sh ohpc ${{ matrix.compiler }} ${{ steps.files.outputs.added_modified }}

  build_on_leap:
    runs-on: ubuntu-latest
    name: Build on LEAP
    container:
      image: ghcr.io/openhpc/ohpc-validate-leap:2.x
    steps:
    - name: Update packages
      run: zypper -n update
    - uses: actions/checkout@v6
    - name: Setup
      run: tests/ci/prepare-ci-environment.sh
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - name: Validate Build
      run: |
        . /etc/profile.d/lmod.sh
        tests/ci/run_build.py ohpc ${{ steps.files.outputs.added_modified }}
        touch /tmp/empty
    - uses: actions/upload-artifact@v7
      with:
        name: leap-rpms
        retention-days: 1
        path: |
          /home/ohpc/rpmbuild/RPMS/noarch/*rpm
          /home/ohpc/rpmbuild/RPMS/x86_64/*rpm
          /tmp/empty

  test_on_leap:
    strategy:
      matrix:
        compiler: [gnu12]
    runs-on: ubuntu-latest
    name: Test on LEAP
    env:
      JOB_SKIP_CI_SPECS: |
        components/perf-tools/likwid/SPECS/likwid.spec
    container:
      image: ghcr.io/openhpc/ohpc-validate-leap:2.x
      options: --privileged --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    needs: build_on_leap
    steps:
    - name: Update packages
      run: zypper -n update
    - uses: actions/checkout@v6
    - name: Setup
      run: tests/ci/prepare-ci-environment.sh
    - id: files
      uses: Ana06/get-changed-files@v2.3.0
    - uses: actions/download-artifact@v8
      with:
        name: leap-rpms
        path: /home/ohpc/rpmbuild/RPMS
    - name: Enable unprivileged user namespaces
      run: |
        sysctl -w kernel.unprivileged_userns_clone=1 || true
        sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Run CI Tests
      run: |
        export SKIP_CI_SPECS="${{ env.SKIP_CI_SPECS }}${{ env.JOB_SKIP_CI_SPECS }}"
        . /etc/profile.d/lmod.sh
        chown ohpc -R tests
        tests/ci/setup_slurm_and_run_tests.sh ohpc ${{ matrix.compiler }} ${{ steps.files.outputs.added_modified }}
