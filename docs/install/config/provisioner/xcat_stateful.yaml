# xCAT stateful (diskful) provisioner configuration
#
# A base OS is installed onto each compute node's local disk and OpenHPC is
# added in the same provisioning pass: the package list and configuration are
# accumulated on the head into an otherpkgs pkglist and an xCAT postscript, which
# xCAT applies automatically when the node installs and first boots. Nodes keep
# their state across reboots. Compute-environment operations are therefore
# definition-based, like OpenCHAMI (see macros.j2), not live-node like Confluent.

provisioner: "xcat_stateful"
provisioner_name: "xCAT"
is_xcat: true
is_xcat_stateful: true

# copycds creates one osimage per provisioning method; the install image backs
# a stateful deployment. Used to select and validate the image by provmethod.
xcat_image_type: "install"

# xCAT release tree to install from ("latest" tracks the current stable
# series; set a versioned directory such as "2.18" to pin). The repo
# definitions are written locally: the .repo files published on xcat.org
# point at a retired "devel" tree and are not usable directly.
xcat_release: "latest"
xcat_repo_base: "https://xcat.org/files/xcat/repos/yum"
# OS-family component of the xcat-dep repository path (EL10 -> rh10)
xcat_dep_dist: "rh10"

# Compute package/config operations are accumulated into an otherpkgs pkglist and
# an xCAT postscript on the head (paths set as shell variables by the "Stage the
# Compute Configuration" step) and applied by xCAT at provisioning. See the
# is_xcat_stateful macros in macros.j2.
