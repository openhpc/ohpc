# Configuration variables for AlmaLinux 10 x86_64 Confluent Slurm recipe
# Replaces LaTeX \newcommand macros from steps.tex

# Base OS configuration
baseOS: "AlmaLinux 10"
OSRepo: "AlmaLinux_10"
ostree: "EL_10"
ostag: "el10"
baseos: "almalinux-10"
baseosshort: "almalinux10"
osimage: "almalinux:10"

# Provisioning and resource management
provisioner: "Confluent"
provheader: "confluent"
rms: "SLURM"
rmsshort: "slurm"

# Architecture
arch: "x86_64"

# Confluent-specific settings
isoimage: "AlmaLinux-10.0-x86_64-dvd.iso"
downloadpage: "https://almalinux.org/get-almalinux/"
confluentprofile: "alma-10.0-x86_64-default"

# Compiler and MPI versions
gnu_version: "gnu15"
openmpi_version: "openmpi5"

# Package manager commands (SMS)
pkgmgr: "dnf"
addrepo: "dnf -y config-manager --add-repo"
clean: "dnf clean expire-cache"
install: "dnf -y install"
groupinstall: "dnf -y groupinstall"
remove: "dnf -y remove"
upgrade: "dnf -y upgrade"
tftppkg: "syslinux-tftpboot"

# Package manager commands (compute nodes via confluent nodeshell)
chrootaddrepo: "nodeshell compute dnf -y config-manager --add-repo"
chrootclean: "dnf --installroot=$CHROOT clean expire-cache"
chrootinstall: "nodeshell compute dnf -y install"
groupchrootinstall: "nodeshell compute dnf -y groupinstall"
chrootupgrade: "dnf -y --installroot=$CHROOT upgrade"

# Repository URLs
beegfsrepo: "https://www.beegfs.io/release/beegfs_7.4.5/dists/beegfs-rhel9.repo"
cudarepo: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/x86_64/cuda-rhel10.repo"

# Boolean toggles for conditional content
isCentOS: true
isCentOS_ww_slurm_x86: false
isSLURM: true
isWarewulf: false
isWarewulf4: false
isWarewulf3: false
isConfluent: true
isx86: true
isaarch: false
isCentOS_x86: true
isxCAT: false
isxCATstateful: false
ispbs: false

# Global constants (from ohpc-doc.sty)
OHPCVersion: "4.0"
OHPCVerTree: "4"

# Product names
ohpc: "OpenHPC"
confluent: "Confluent"
SLURM: "Slurm"
infiniband: "InfiniBand"
OmniPath: "Omni-Path"
beegfs: "BeeGFS"
clustershell: "ClusterShell"
conman: "ConMan"
genders: "genders"
nhc: "NHC"
lustre: "Lustre"
os_name: "AlmaLinux 10"
intelr: "Intel®"

# Feature toggles
enable_ib: false
enable_opa: false
enable_clustershell: false
enable_genders: false
enable_magpie: false
enable_ipmisol: false
add_ofed: false
enable_ipoib: false
optional_kargs: ""
enable_dracut: false
enable_kargs: false
enable_mpi_defaults: true
enable_intel_packages: false

# Derived values
install_cmd: "dnf -y install"
provisioner_lower: "confluent"
